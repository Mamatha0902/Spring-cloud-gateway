spring.application.name=gateway-application

# Route 1 - for /emp/**
spring.cloud.gateway.server.webflux.routes[0].id=employee-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8011
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/emp/**

spring.cloud.gateway.server.webflux.routes[1].id=auth-endpoint
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8011
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[2].id=task-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/tasks/**

spring.cloud.gateway.server.webflux.routes[3].id=manager-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8011
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/manager/**



